[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muzhen"
version = "2.2.0"
description = "Windows desktop app for extracting hardcoded Chinese/CJK subtitles from video into ASS/SRT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.7",
    "av>=13.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "rapidocr>=3.10",
    "onnxruntime-directml>=1.19; sys_platform == 'win32'",
    "onnxruntime>=1.19; sys_platform != 'win32'",
]

[project.urls]
Homepage = "https://github.com/wanngxuanji/Muzhen"
Repository = "https://github.com/wanngxuanji/Muzhen"
Issues = "https://github.com/wanngxuanji/Muzhen/issues"
Changelog = "https://github.com/wanngxuanji/Muzhen/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pillow>=10.0",
]
build = [
    "pyinstaller>=6.10",
]

[project.gui-scripts]
muzhen = "muzhen.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muzhen = ["ui/assets/*.svg", "ui/assets/*.ico", "ui/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
