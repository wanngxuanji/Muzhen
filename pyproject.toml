[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transapp"
version = "0.1.0"
description = "Windows desktop app for extracting hardcoded Chinese/CJK subtitles from video into ASS/SRT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "av>=13.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "rapidocr-onnxruntime>=1.4",
    "onnxruntime-directml>=1.19; sys_platform == 'win32'",
    "onnxruntime>=1.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
transapp = "transapp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
