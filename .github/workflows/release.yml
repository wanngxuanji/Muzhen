name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (defaults to tag or pyproject.toml)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Portable Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      - name: Run test suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q -W error

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ver = ""
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)) {
            $ver = $env:INPUT_VERSION.Trim()
          }
          if ([string]::IsNullOrWhiteSpace($ver) -and $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v(.+)$') {
            $ver = $Matches[1]
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $text = Get-Content -LiteralPath "pyproject.toml" -Raw -Encoding UTF8
            $m = [regex]::Match($text, '(?m)^\s*version\s*=\s*"([^"]+)"')
            if (-not $m.Success) {
              throw "Failed to resolve version from pyproject.toml"
            }
            $ver = $m.Groups[1].Value
          }
          $ver = $ver.TrimStart("v", "V")
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Windows portable package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build_release.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TransApp-v${{ steps.version.outputs.VERSION }}-win64-portable
          path: |
            release/TransApp-v*-win64-portable.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/TransApp-v*-win64-portable.zip
            release/SHA256SUMS.txt
